<div class="card border-0 shadow-sm table-card">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        
        <thead class="table-light">
          <tr>
            <th scope="col" class="text-center" width="5%">ID</th>
            <th scope="col" width="35%">ชื่อหนังสือ / ISBN</th>
            <th scope="col" width="20%">สำนักพิมพ์</th>
            <th scope="col" class="text-center" width="10%">ทั้งหมด</th>
            <th scope="col" class="text-center" width="10%">คงเหลือ</th>
            <th scope="col" class="text-center" width="20%">จัดการ</th>
          </tr>
        </thead>
        
        <tbody>
          <tr *ngFor="let book of booksList">
            
            <td class="text-center fw-bold text-muted">#{{ book.id }}</td>
            
            <td>
              <div class="d-flex align-items-center gap-3">
                <div class="book-cover-mini bg-light rounded d-flex align-items-center justify-content-center text-muted">
                  <i class="bi bi-book"></i>
                </div>
                <div>
                  <h6 class="mb-0 fw-bold text-dark">{{ book.title }}</h6>
                  <small class="text-muted">ISBN: {{ book.isbn }}</small>
                </div>
              </div>
            </td>
            
            <td>{{ book.publisher }}</td>
            
            <td class="text-center">{{ book.total }}</td>
            
            <td class="text-center">
              <span class="badge rounded-pill" 
                    [ngClass]="book.available > 0 ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'">
                {{ book.available }} เล่ม
              </span>
            </td>
            
            <td class="text-center">
              <button class="btn btn-sm btn-light text-primary me-2 btn-action" title="แก้ไข">
                <i class="bi bi-pencil-square"></i>
              </button>
              
              <button class="btn btn-sm btn-light text-danger btn-action" 
                      (click)="deleteBook(book.id)" 
                      title="ลบหนังสือ">
                <i class="bi bi-trash"></i>
              </button>
            </td>

          </tr>

          <tr *ngIf="booksList.length === 0">
            <td colspan="6" class="text-center py-5 text-muted">
              <i class="bi bi-inbox fs-1 d-block mb-2"></i>
              ไม่พบข้อมูลหนังสือในระบบ
            </td>
          </tr>
        </tbody>
        
      </table>
    </div>
  </div>
</div>
