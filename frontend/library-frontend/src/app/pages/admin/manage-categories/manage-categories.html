<div class="container-fluid p-0 fade-in">
  
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold text-dark mb-1">🏷️ จัดการหมวดหมู่หนังสือ</h3>
      <p class="text-muted small">กำหนดประเภทหนังสือเพื่อให้สมาชิกค้นหาได้ง่ายขึ้น</p>
    </div>
    <button class="btn btn-primary rounded-pill px-4 shadow-sm" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
      <i class="bi bi-plus-circle me-1"></i> เพิ่มหมวดหมู่
    </button>
  </div>

  <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
    <table class="table table-hover align-middle mb-0">
      <thead class="bg-light">
        <tr>
          <th class="ps-4" width="10%">ID</th>
          <th width="60%">ชื่อหมวดหมู่</th>
          <th class="text-center" width="15%">จำนวนหนังสือ</th>
          <th class="text-center" width="15%">จัดการ</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cat of categoriesList">
          <td class="ps-4 fw-bold text-secondary">#{{ cat.id }}</td>
          <td>
            <div class="d-flex align-items-center gap-2">
              <span class="category-dot"></span>
              <span class="fw-semibold text-dark">{{ cat.name }}</span>
            </div>
          </td>
          <td class="text-center">
            <span class="badge bg-primary-subtle text-primary rounded-pill px-3">
              {{ cat.bookCount }} เล่ม
            </span>
          </td>
          <td class="text-center">
            <button class="btn btn-icon text-primary me-1" title="แก้ไข">
              <i class="bi bi-pencil-square"></i>
            </button>
            <button class="btn btn-icon text-danger" (click)="deleteCategory(cat.id)" title="ลบ">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<div class="modal fade" id="addCategoryModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg rounded-4">
      <div class="modal-header border-0">
        <h5 class="fw-bold m-0">เพิ่มหมวดหมู่ใหม่</h5>
        <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal"></button>
      </div>
      <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
        <div class="modal-body py-4">
          <label class="form-label small fw-bold text-muted">ชื่อหมวดหมู่ <span class="text-danger">*</span></label>
          <input type="text" class="form-control bg-light border-0 py-2 px-3 rounded-3 shadow-none" 
                 formControlName="categoryName" placeholder="เช่น วิทยาศาสตร์, นวนิยาย...">
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">ยกเลิก</button>
          <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold" [disabled]="!categoryForm.valid">
            บันทึก
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
