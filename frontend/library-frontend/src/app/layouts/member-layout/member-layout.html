<div class="member-shell">
  
  <nav class="saas-navbar saas-glass">
    <div class="navbar-container">
      
      <!-- LEFT: Logo -->
      <a class="nav-brand" [routerLink]="['/catalog']">
        <div class="brand-logo"><i class="bi bi-book-half"></i></div>
        <span class="brand-text">Library</span>
      </a>



      <!-- RIGHT: Menu -->
      <div class="nav-menu d-flex align-items-center">
        <a class="nav-link" [routerLink]="['/catalog']" routerLinkActive="active">Discover</a>
        
        <ng-container *ngIf="authService.isAuthenticated(); else loginBtn">
          <!-- Admin Panel Button -->
          <a *ngIf="authService.getUserRole() === 'admin'" 
             class="btn btn-dark rounded-pill px-3 ms-2 me-1 shadow-sm d-flex align-items-center" 
             style="font-size: 14px; font-weight: 500;"
             [routerLink]="['/admin/dashboard']">
            <i class="bi bi-shield-lock-fill me-2"></i> Admin Panel
          </a>

          <a class="nav-link" *ngIf="authService.getUserRole() !== 'admin'" [routerLink]="['/my-borrows']" routerLinkActive="active">My Borrowings</a>
          
          <div class="profile-dropdown position-relative">
            <a class="profile-link" [routerLink]="['/profile']">
              <div class="avatar"><i class="bi bi-person-fill"></i></div>
              <span class="fw-semibold ms-2 d-none d-md-inline">Profile</span>
            </a>
            <!-- Simple Logout placed directly in layout for now -->
            <a class="nav-link text-danger ms-3" style="cursor:pointer;" (click)="logout()">
              <i class="bi bi-box-arrow-right"></i> Logout
            </a>
          </div>
        </ng-container>

        <ng-template #loginBtn>
          <button class="btn btn-primary rounded-pill px-4 ms-2 shadow-sm" style="font-weight: 500; background: #007aff; border: none;" (click)="authService.openModal('login')">
            Log in
          </button>
        </ng-template>
      </div>

    </div>
  </nav>

  <main class="member-body">
    <div class="container-xl">
      <div class="member-card shadow-sm fade-in">
        <router-outlet></router-outlet>
      </div>
    </div>
  </main>

</div>
